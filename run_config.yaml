# Camera Toolkit run configuration (user)
# Generated from interactive settings; original defaults in run_config.default.yaml
device: /dev/video0
backend: V4L2
report_dir: report
opencv_extra_dir: .
auto_impl: python
manual_impl: cpp
combined_report: true
official_console_output: false
manual_reconnect_window: 5
manual_long_run: 0
cpp:
  source: selfbuild
  apt_package: libopencv-dev
  source_dir: ./opencv_source_code
  build_dir: ./build
  branch: latest
official_cpp:
  source_dir: ./opencv_source_code
  build_dir: ./build
  branch: latest
